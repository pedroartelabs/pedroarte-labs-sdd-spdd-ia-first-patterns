name: Governance checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rule-drift:
    name: Check generated rule drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Check rule drift
        run: python scripts/check-generated-rule-drift.py

  validate-specs:
    name: Validate specifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Validate specifications
        run: python scripts/validate-specs.py

      - name: Validate prompts
        run: python scripts/validate-prompts.py

      - name: Validate traceability
        run: python scripts/validate-traceability.py
